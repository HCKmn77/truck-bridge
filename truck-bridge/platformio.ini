; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
  arduino-libraries/Servo
  https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library

board_microros_distro = humble
monitor_speed = 115200
monitor_port = /dev/ttyTHS1 ; esp32 logs are send to the UART port of the Jetson board
upload_port = /dev/ttyUSB0  ; Upload port for the esp32dev board (USB-C connector)

; To change micro-ROS transport layer set 'board_microros_transport' AND build flag 'USE_XXX_TRANSPORT'
; unfortunately, the transport layer cannot be changed only at one place
board_microros_transport = serial ;wifi ; serial; ethernet
build_flags = 
        
        ; Define target platform 
        -D TARGET_ESP32 

        ; Define micro-ROS transport layer
        -D USE_SERIAL_TRANSPORT
        ; -D USE_ETHERNET_TRANSPORT
        ; -D USE_WIFI_TRANSPORT
        
        ; Set Log level defined in logger.cpp
        -D LOG_LEVEL=LOG_LEVEL_WARN


[env:test_rc_channels]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<../examples/rc_controller/rc_controller_test.cpp>
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_flags = -D TARGET_ESP32

[env:test_bmi270]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<../examples/bmi270_test/main.cpp>
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_flags = -D TARGET_ESP32
lib_deps = 
  https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library

[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
upload_port = /dev/ttyACM0
monitor_speed = 115200
build_flags = -D TARGET_RP2040
platform_packages =
  toolchain-gccarmnoneeabi@~1.90301.0

# micro-ros config
board_microros_distro = humble
; board_microros_transport = wifi_nina

# Uncomment to use serial transport instead of wifi_nina
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/AlfredoSystems/AlfredoCRSF
    arduino-libraries/Arduino_LSM6DSOX
    arduino-libraries/Arduino_HTS221
    arduino-libraries/WiFiNINA
    Servo
